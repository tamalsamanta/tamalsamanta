name: Refresh README

on:
  schedule:
    # every night at 04:17 UTC
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/generate_readme.py"
      - "popcat.txt"

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render today's README
        run: python scripts/generate_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the README changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README is already up to date"
            exit 0
          fi
          git add README.md
          git commit -m "chore: refresh README [skip ci]"
          git push
